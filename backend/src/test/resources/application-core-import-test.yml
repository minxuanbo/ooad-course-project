spring:
  datasource:
    url: ${RBAC_CORE_IMPORT_TEST_DB_URL}
    username: ${RBAC_CORE_TEST_DB_USER}
    password: ${RBAC_CORE_TEST_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 4
      transaction-isolation: TRANSACTION_READ_COMMITTED
  sql.init:
    mode: always
    schema-locations: file:../deploy/rbac-core-schema.sql,file:../deploy/rbac-core-runtime.sql
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
rbac.initialize: false

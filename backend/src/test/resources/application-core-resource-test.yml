spring:
  datasource:
    url: ${RBAC_CORE_RESOURCE_TEST_DB_URL}
    username: ${RBAC_CORE_TEST_DB_USER}
    password: ${RBAC_CORE_TEST_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 6
      transaction-isolation: TRANSACTION_READ_COMMITTED
  sql.init:
    mode: always
    schema-locations: file:../deploy/rbac-core-schema.sql,file:../deploy/rbac-core-runtime.sql
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  web.resources.add-mappings: false
rbac.initialize: false
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF

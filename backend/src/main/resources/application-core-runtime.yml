spring:
  application.name: municipal-rbac-core
  datasource:
    url: ${RBAC_CORE_DB_URL:}
    username: ${RBAC_CORE_DB_USER:}
    password: ${RBAC_CORE_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      transaction-isolation: TRANSACTION_READ_COMMITTED
  sql.init.mode: never
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  web.resources.add-mappings: false
  jackson.deserialization.fail-on-unknown-properties: true
server.port: ${PORT:8081}
server.forward-headers-strategy: none
app.audit.trusted-proxies: ${AUDIT_TRUSTED_PROXIES:}
app.backend-strategy: ${APP_BACKEND_STRATEGY:structured}
app.identity.enabled: ${APP_IDENTITY_ENABLED:false}
app.identity.allowed-origins: ${IDENTITY_ALLOWED_ORIGINS:}
app.identity.operations-file: ${IDENTITY_OPERATIONS_FILE:}
app.identity.issuer: ${IDENTITY_JWT_ISSUER:http://127.0.0.1:8081}
app.identity.jwt-secret: ${IDENTITY_JWT_SECRET:}
rbac:
  initialize: false
  core:
    source-dir: ${RBAC_CORE_SOURCE_DIR:.}
logging.level:
  root: INFO
  com.municipal.rbaccore.api: DEBUG
  com.municipal.rbaccore.service: DEBUG
  com.municipal.rbaccore.infrastructure: DEBUG
  org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF

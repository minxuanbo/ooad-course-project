        '403':
          description: 实际API权限/部门范围/管理准入拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 数据冲突或写后失去最后完整维护者；全回滚
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 安全内部错误，requestId可追踪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreateDTO'
      x-management-scope: root
      x-initial-permission-code: rbac.roles.write
      x-maintenance-member: true
  /api/roles/{id}:
    patch:
      operationId: patchRole
      tags:
      - 角色与权限
      summary: 改名或启停角色
      description: 至少一个字段，缺省保留/显式null拒绝；停用保留关联。根锁、最新权限及完整K保护。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleVOResponse'
        '400':
          description: 输入格式/关联/树或日志游标错误；无部分写入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 账号/口令或可信身份失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 实际API权限/部门范围/管理准入拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 已获可见范围内目标不存在
          content:
            application/json:
              schema:

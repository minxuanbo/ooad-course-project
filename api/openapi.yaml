openapi: 3.1.0
info:
  title: 市政公司统一权限管理系统 API
  version: 1.5.1
  description: structured/ddd共享契约：29项RBAC管理操作及8项可选通用应用身份鉴权操作。两类登录统一使用HS256身份JWT，不包含角色或权限快照，管理端与外部应用受众隔离。应用目录来自登记数据及状态，APP_IDENTITY_ENABLED只控制外部8项入口。角色可跨应用拥有权限，Permission—API映射必须同系统。统一身份审计2项不在本契约，K仍为17项RBAC路由。
servers:
- url: /
  description: 同源部署；路径已包含/api，避免重复拼接
tags:
- name: 认证与本人
- name: 部门与人员
- name: 人员授权
- name: 角色与权限
- name: 资源与映射
- name: 鉴权日志
- name: 统一身份鉴权
  description: 通用应用的完整八项身份鉴权协议，不含外部业务审计。
security:
- BearerAuth: []
paths:
  /api/auth/login:
    post:
      operationId: login
      tags:
      - 认证与本人
      summary: 工号或手机号登录
      description: 工号或手机号加口令定位同一账号，核实启用状态和实际管理API准入后签发aud=rbac的身份JWT；普通员工仅有外部应用角色仍不能进入管理端。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginVOResponse'
        '400':
          description: 输入格式/关联/树或日志游标错误；无部分写入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 账号/口令或可信身份失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 实际API权限/部门范围/管理准入拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 安全内部错误，requestId可追踪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDTO'
      security: []
      x-management-scope: anonymous
      x-maintenance-member: false
  /api/auth/logout:
    post:
      operationId: logout
      tags:
      - 认证与本人
      summary: 退出当前身份
      description: Authorization可选；撤销所带Bearer，重复/未知/失效/缺失/非Bearer沿既有行为成功空操作。撤销后本人请求401。无必填body。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '500':
          description: 安全内部错误，requestId可追踪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - {}
      - BearerAuth: []
      x-management-scope: logout
      x-maintenance-member: false
  /api/me:
    get:
      operationId: getMe
      tags:
      - 认证与本人
      summary: 本人身份
      description: 只要求有效身份，不以users.read作为前置；不能指定他人id。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeVOResponse'
        '401':
          description: 账号/口令或可信身份失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 安全内部错误，requestId可追踪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-management-scope: self
      x-maintenance-member: false
  /api/me/permissions:
    get:
      operationId: getMyPermissions
      tags:
      - 认证与本人
      summary: 本人本系统有效权限
      description: 只返回实际有效权限；不补导航祖先，不直接推断具体API可调用性。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionListResponse'
        '401':
          description: 账号/口令或可信身份失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 安全内部错误，requestId可追踪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-management-scope: self
      x-maintenance-member: false
  /api/departments/tree:
    get:
      operationId: listDepartments
      tags:
      - 部门与人员
      summary: 可管理部门树
      description: 扁平节点按parentId构树，只本人部门/后代；可见根parentId投影null。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentListResponse'
        '401':
          description: 账号/口令或可信身份失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 实际API权限/部门范围/管理准入拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 安全内部错误，requestId可追踪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-management-scope: subtree
      x-initial-permission-code: rbac.users.read
      x-maintenance-member: true
  /api/users:
    get:
      operationId: listUsers
      tags:
      - 部门与人员
      summary: 人员组合查询与分页
      description: q匹配姓名或工号；数据库先范围再AND组合过滤、同条件计数、id升序分页。越末页items=[]，total保持。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageVOResponse'
        '400':
          description: 输入格式/关联/树或日志游标错误；无部分写入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 账号/口令或可信身份失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 实际API权限/部门范围/管理准入拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 已获可见范围内目标不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 安全内部错误，requestId可追踪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/Q'
      - $ref: '#/components/parameters/DepartmentId'
      - $ref: '#/components/parameters/Enabled'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      x-management-scope: subtree
      x-initial-permission-code: rbac.users.read
      x-maintenance-member: true
  /api/users/{id}/roles:
    get:
      operationId: getUserRoles
      tags:
      - 人员授权
      summary: 当前完整角色
      description: 包含停用及当前不可再分配的已保存角色；非根未知人员统一范围403。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRolesVOResponse'
        '400':
          description: 输入格式/关联/树或日志游标错误；无部分写入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 账号/口令或可信身份失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 实际API权限/部门范围/管理准入拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 已获可见范围内目标不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 安全内部错误，requestId可追踪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/Id'
      x-management-scope: subtree
      x-initial-permission-code: rbac.users.read
      x-maintenance-member: true
    put:
      operationId: replaceUserRoles
      tags:
      - 人员授权
      summary: 整体替换人员角色
      description: 锁后读取当前角色集合，只对新增与删除项检查授予级别及完整有效权限子集。无权改变的现有项可以原样保留，非法变化整次回滚。自定义角色仅可信根直属有效五级管理员可增删；人员停用/调动按原级别和部门范围判断。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithRolesVOResponse'
        '400':
          description: 输入格式/关联/树或日志游标错误；无部分写入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 账号/口令或可信身份失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 实际API权限/部门范围/管理准入拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 已获可见范围内目标不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 数据冲突或写后失去最后完整维护者；全回滚
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 安全内部错误，requestId可追踪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdsDTO'
      x-management-scope: subtree
      x-initial-permission-code: rbac.users.roles.write
      x-maintenance-member: true
  /api/users/{id}/assignable-roles:
    get:
      operationId: listAssignableRoles
      tags:
      - 人员授权
      summary: 受限候选角色分页
      description: q匹配角色名称/编码。只启用且全部有效Permission ID是本人集合子集的角色，外系统部分不得先过滤。先过滤再计数分页。 非管理员不能修改本人、同级或上级；可信根直属有效五级管理员有人员保护例外，仍需实际API、范围及完整K。自定义角色不冻结人员；仅其新增/删除关联受管理员资格限制。角色变更按锁后差集校验，原有不可改项可保留。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignableRolePageVOResponse'
        '400':
          description: 输入格式/关联/树或日志游标错误；无部分写入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 账号/口令或可信身份失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 实际API权限/部门范围/管理准入拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 已获可见范围内目标不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 安全内部错误，requestId可追踪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Q'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      x-management-scope: subtree
      x-initial-permission-code: rbac.users.roles.write
      x-maintenance-member: true
  /api/users/{id}/status:
    patch:
      operationId: disableUser
      tags:
      - 人员授权
      summary: 停用人员
      description: 仅接受enabled:false；保留角色和部门。停用后旧身份401，再登录401 LOGIN_FAILED；共根锁及完整K保护。 非管理员不能修改本人、同级或上级；可信根直属有效五级管理员有人员保护例外，仍需实际API、范围及完整K。自定义角色不冻结人员；仅其新增/删除关联受管理员资格限制。角色变更按锁后差集校验，原有不可改项可保留。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithRolesVOResponse'
        '400':
          description: 输入格式/关联/树或日志游标错误；无部分写入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 账号/口令或可信身份失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 实际API权限/部门范围/管理准入拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 已获可见范围内目标不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 数据冲突或写后失去最后完整维护者；全回滚
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 安全内部错误，requestId可追踪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDisableDTO'
      x-management-scope: subtree
      x-initial-permission-code: rbac.users.disable
      x-maintenance-member: false
  /api/users/{id}/department:
    put:
      operationId: moveUser
      tags:
      - 人员授权
      summary: 跨部门调动
      description: 原/目标部门都须在本人子树，保持同一用户/角色，后续范围随归属变化；非管理员本人/同级/上级保护及双范围校验，根锁后重验。 非管理员不能修改本人、同级或上级；可信根直属有效五级管理员有人员保护例外，仍需实际API、范围及完整K。自定义角色不冻结人员；仅其新增/删除关联受管理员资格限制。角色变更按锁后差集校验，原有不可改项可保留。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithRolesVOResponse'
        '400':
          description: 输入格式/关联/树或日志游标错误；无部分写入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 账号/口令或可信身份失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 实际API权限/部门范围/管理准入拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 已获可见范围内目标不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 数据冲突或写后失去最后完整维护者；全回滚
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 安全内部错误，requestId可追踪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDepartmentDTO'
      x-management-scope: subtree
      x-initial-permission-code: rbac.users.department.write
      x-maintenance-member: false
  /api/roles:
    get:
      operationId: listRoles
      tags:
      - 角色与权限
      summary: 角色组合查询
      description: q匹配名称/编码，状态AND过滤；id升序、数据库分页/同条件total。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePageVOResponse'
        '400':
          description: 输入格式/关联/树或日志游标错误；无部分写入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 账号/口令或可信身份失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 实际API权限/部门范围/管理准入拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 安全内部错误，requestId可追踪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/Q'
      - $ref: '#/components/parameters/Enabled'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      x-management-scope: root
      x-initial-permission-code: rbac.roles.read
      x-maintenance-member: true
    post:
      operationId: createRole
      tags:
      - 角色与权限
      summary: 新建空权限角色
      description: 默认启用且无权限；编码按真实列排序规则判重，重复409 DATA_CONFLICT；编码创建后不可改。
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleVOResponse'
        '400':
          description: 输入格式/关联/树或日志游标错误；无部分写入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 账号/口令或可信身份失败
          content:
            application/json:
              schema:

                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'RBAC管理受众JWT；通过Authorization: Bearer携带。只含身份与会话字段，不包含角色或权限；不能与外部应用JWT混用。'
    applicationJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 外部应用身份JWT；仅含sub、aud、iss、iat、exp、jti，不包含角色或权限。支持当前会话即时撤销，运行期权限逐请求读取。
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: 正安全整数；范围外与不存在的错误顺序见业务约束
      schema:
        type: integer
        minimum: 1
        maximum: 9007199254740991
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 2147483647
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Q:
      name: q
      in: query
      description: 按接口指定的姓名/工号、名称/编码或方法/路径作不区分大小写的包含搜索；先去首尾空白，处理后长度上限100
      schema:
        type: string
        maxLength: 100
    Enabled:
      name: enabled
      in: query
      description: 省略表示全部；只接收字面true/false
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
    DepartmentId:
      name: departmentId
      in: query
      description: 省略表示本人范围；选择部门包含其后代，不能扩展操作者范围
      schema:
        type: integer
        minimum: 1
        maximum: 9007199254740991
    SystemId:
      name: systemId
      in: query
      description: 省略为真实rbac系统ID；显式课程接入时可选择课程系统，未接入系统403
      schema:
        type: integer
        minimum: 1
        maximum: 9007199254740991
    LogUserId:
      name: userId
      in: query
      description: 正用户ID
      schema:
        type: integer
        minimum: 1
        maximum: 9007199254740991
    LogUsername:
      name: username
      in: query
      description: 工号精确匹配
      schema:
        type: string
        maxLength: 100
    LogAppCode:
      name: appCode
      in: query
      description: 系统编码精确匹配
      schema:
        type: string
        maxLength: 191
    LogAllowed:
      name: allowed
      in: query
      description: 允许/拒绝
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
    LogEvent:
      name: event
      in: query
      description: 事件类型精确匹配
      schema:
        type: string
        maxLength: 32
    LogFrom:
      name: from
      in: query
      description: UTC起点，含；同时提供to时必须from<to
      schema:
        type: string
        format: date-time
        pattern: Z$
    LogTo:
      name: to
      in: query
      description: UTC终点，不含；不接受时区偏移替代Z
      schema:
        type: string
        format: date-time
        pattern: Z$
    Cursor:
      name: cursor
      in: query
      description: 服务端不透明游标；筛选/limit绑定，变更后清空重查
      schema:
        type: string
        maxLength: 4096
    Limit:
      name: limit
      in: query
      description: 日志每批条数
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
  schemas:
    IdentityVO:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        username:
          type: string
          maxLength: 100
          description: 工号，保留前导零；不另返回employeeNo或手机号
        name:
          type: string
          maxLength: 100
        departmentId:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        enabled:
          type: boolean
        departmentName:
          type: string
        managementLevel:
          type: integer
          minimum: 1
          maximum: 5
        globalScope:
          type: boolean
          description: 当前身份直属经来源核实且覆盖有效组织树的共同根
        routes:
          type: array
          items:
            $ref: '#/components/schemas/ManagementRouteVO'
      required:
      - id
      - username
      - name
      - departmentId
      - enabled
      - departmentName
      - managementLevel
      - globalScope
      - routes
    LoginVO:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
          description: 标准HS256身份JWT，仅含sub、aud、iss、iat、exp、jti，不含角色或权限快照。管理受众为rbac，外部受众为单一登记应用。
          pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
        user:
          $ref: '#/components/schemas/IdentityVO'
        expiresIn:
          type: integer
          minimum: 1
      required:
      - token
      - user
      - expiresIn
    MeVO:
      type: object
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/IdentityVO'
      required:
      - user
    UserVO:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        username:
          type: string
          maxLength: 100
        name:
          type: string
          maxLength: 100
        departmentId:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        departmentName:
          type: string
          maxLength: 191
        enabled:
          type: boolean
        position:
          type:
          - string
          - 'null'
          maxLength: 191
          description: 只读岗位资料，不提供编辑
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleVO'
          description: 当前保存角色摘要，包含停用角色
        writable:

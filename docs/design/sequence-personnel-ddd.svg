  <rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><text x="28" y="38" font-size="26" text-anchor="start" fill="#223046">人员角色整体替换 · DDD差异</text><text x="28" y="70" font-size="16" text-anchor="start" fill="#223046">仅成功差异片段；共同HTTP/身份/日志/锁后鉴权/K/提交均省略，不表示取消。赋值调用不重复画回复；异常约定见正文。</text><rect x="25" y="860" width="2170" height="147" fill="#f8fafc" stroke="#91a2b7"/><path d="M25,890h70v-30" fill="none" stroke="#91a2b7"/><text x="35" y="882" font-size="16" text-anchor="start" fill="#223046">loop</text><text x="516" y="882" font-size="16" text-anchor="start" fill="#223046">[新增项 selected − existing]</text><rect x="25" y="1030" width="2170" height="147" fill="#f8fafc" stroke="#91a2b7"/><path d="M25,1060h70v-30" fill="none" stroke="#91a2b7"/><text x="35" y="1052" font-size="16" text-anchor="start" fill="#223046">loop</text><text x="516" y="1052" font-size="16" text-anchor="start" fill="#223046">[删除项 existing − selected]</text><path d="M110,165V1560" stroke="#9aa7b7" stroke-dasharray="7 6"/><rect x="20" y="100" width="180" height="65" fill="white" stroke="#223046"/><text x="110" y="139" font-size="19" text-anchor="middle" fill="#223046">obj: 调用者</text><path d="M490,165V1560" stroke="#9aa7b7" stroke-dasharray="7 6"/><rect x="320" y="100" width="340" height="65" fill="white" stroke="#223046"/><text x="490" y="139" font-size="16.332819722650232" text-anchor="middle" fill="#223046">service: DddUserManagementService</text><path d="M870,165V1560" stroke="#9aa7b7" stroke-dasharray="7 6"/><rect x="700" y="100" width="340" height="65" fill="white" stroke="#223046"/><text x="870" y="139" font-size="19" text-anchor="middle" fill="#223046">users: UserRepository</text><path d="M1250,165V1560" stroke="#9aa7b7" stroke-dasharray="7 6"/><rect x="1080" y="100" width="340" height="65" fill="white" stroke="#223046"/><text x="1250" y="139" font-size="19" text-anchor="middle" fill="#223046">roles: RoleRepository</text><path d="M1630,165V1560" stroke="#9aa7b7" stroke-dasharray="7 6"/><rect x="1460" y="100" width="340" height="65" fill="white" stroke="#223046"/><text x="1630" y="126" font-size="17" text-anchor="middle" fill="#223046">«MetaClass»</text><text x="1630" y="151" font-size="20" text-anchor="middle" fill="#223046">: RoleAssignmentPolicy</text><path d="M2010,165V1560" stroke="#9aa7b7" stroke-dasharray="7 6"/><rect x="1840" y="100" width="340" height="65" fill="white" stroke="#223046"/><text x="2010" y="139" font-size="19" text-anchor="middle" fill="#223046">target: User</text><rect x="103" y="210" width="14" height="1330" fill="white" stroke="#223046"/><rect x="483" y="245" width="14" height="1270" fill="white" stroke="#223046"/><rect x="863" y="415" width="14" height="60" fill="white" stroke="#223046"/><rect x="1623" y="585" width="14" height="60" fill="white" stroke="#223046"/><rect x="1243" y="755" width="14" height="60" fill="white" stroke="#223046"/><rect x="1623" y="925" width="14" height="60" fill="white" stroke="#223046"/><rect x="1623" y="1095" width="14" height="60" fill="white" stroke="#223046"/><rect x="2003" y="1265" width="14" height="60" fill="white" stroke="#223046"/><rect x="863" y="1435" width="14" height="60" fill="white" stroke="#223046"/><path d="M117,245H483" stroke="#223046" marker-end="url(#filled)"/><text x="129" y="231" font-size="18" text-anchor="start" fill="#223046">1 replaceRoles 的差异片段</text><path d="M497,415H863" stroke="#223046" marker-end="url(#filled)"/><text x="509" y="401" font-size="18" text-anchor="start" fill="#223046">2 target = find(User.Key(id))</text><path d="M497,585H1623" stroke="#223046" marker-end="url(#filled)"/><text x="509" y="571" font-size="18" text-anchor="start" fill="#223046">3 canManage(actor, global, target)</text><path d="M497,755H1243" stroke="#223046" marker-end="url(#filled)"/><text x="509" y="741" font-size="18" text-anchor="start" fill="#223046">4 selected = select(Role.Selection(ids))</text><path d="M497,925H1623" stroke="#223046" marker-end="url(#filled)"/><text x="509" y="911" font-size="18" text-anchor="start" fill="#223046">5 canAssign(added, level, custom, ids, systems)</text><path d="M497,1095H1623" stroke="#223046" marker-end="url(#filled)"/><text x="509" y="1081" font-size="18" text-anchor="start" fill="#223046">6 canRemove(removed, level, custom, ids, systems)</text><path d="M497,1265H2003" stroke="#223046" marker-end="url(#filled)"/><text x="509" y="1251" font-size="18" text-anchor="start" fill="#223046">7 changed = replaceRoles(selected)</text><path d="M497,1435H863" stroke="#223046" marker-end="url(#filled)"/><text x="509" y="1421" font-size="18" text-anchor="start" fill="#223046">8 saved = save(changed)</text></g></svg>
chor="start" fill="#223046">5 canAssign(added, level, custom, ids, systems, owners, ancestors)</text><path d="M597,1095H2023" stroke="#223046" marker-end="url(#filled)"/><text x="609" y="1081" font-size="18" text-anchor="start" fill="#223046">6 canRemove(removed, level, custom, ids, systems, owners, ancestors)</text><path d="M597,1265H2503" stroke="#223046" marker-end="url(#filled)"/><text x="609" y="1251" font-size="18" text-anchor="start" fill="#223046">7 changed = replaceRoles(selected)</text></g></svg>
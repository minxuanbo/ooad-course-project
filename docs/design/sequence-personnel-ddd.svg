  <rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><text x="28" y="38" font-size="26" text-anchor="start" fill="#223046">人员角色整体替换 · DDD差异</text><text x="28" y="70" font-size="16" text-anchor="start" fill="#223046">仅成功差异片段；共同HTTP/身份/日志/锁后鉴权/K/提交均省略，不表示取消。赋值调用不重复画回复；异常约定见正文。</text><rect x="25" y="860" width="2670" height="150" fill="#f8fafc" stroke="#91a2b7"/><path d="M25,890h70v-30" fill="none" stroke="#91a2b7"/><text x="35" y="882" font-size="16" text-anchor="start" fill="#223046">loop</text><text x="616" y="882" font-size="16" text-anchor="start" fill="#223046">[新增项 selected − existing]</text><rect x="25" y="1030" width="2670" height="150" fill="#f8fafc" stroke="#91a2b7"/><path d="M25,1060h70v-30" fill="none" stroke="#91a2b7"/><text x="35" y="1052" font-size="16" text-anchor="start" fill="#223046">loop</text><text x="616" y="1052" font-size="16" text-anchor="start" fill="#223046">[删除项 existing − selected]</text><path d="M110,165V1440" stroke="#9aa7b7" stroke-dasharray="7 6"/><rect x="20" y="100" width="180" height="65" fill="white" stroke="#223046"/><text x="110" y="139" font-size="19" text-anchor="middle" fill="#223046">obj: 调用者</text><path d="M590,165V1440" stroke="#9aa7b7" stroke-dasharray="7 6"/><rect x="420" y="100" width="340" height="65" fill="white" stroke="#223046"/><text x="590" y="139" font-size="16.332819722650232" text-anchor="middle" fill="#223046">service: DddUserManagementService</text><path d="M1070,165V1440" stroke="#9aa7b7" stroke-dasharray="7 6"/><rect x="900" y="100" width="340" height="65" fill="white" stroke="#223046"/><text x="1070" y="139" font-size="19" text-anchor="middle" fill="#223046">users: UserRepository</text><path d="M1550,165V1440" stroke="#9aa7b7" stroke-dasharray="7 6"/><rect x="1380" y="100" width="340" height="65" fill="white" stroke="#223046"/><text x="1550" y="139" font-size="19" text-anchor="middle" fill="#223046">roles: RoleRepository</text><path d="M2030,165
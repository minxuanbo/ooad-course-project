  <rect width="100%" height="100%" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="30" y="43" font-size="28" text-anchor="start" fill="#18212b">当前身份校验 · 类图</text><text x="30" y="77" font-size="18" text-anchor="start" fill="#18212b">当前结构化实现 · 只展示require相关成员；users/identities/requestContext为字段关联，虚线为局部对象、返回类型或静态调用依赖。</text><polyline points="600,455 480,455" fill="none" stroke="#18212b" stroke-width="1.8"  marker-end="url(#open)"/><text x="514" y="440" font-size="18" text-anchor="start" fill="#18212b">users</text><polyline points="850,390 850,275" fill="none" stroke="#18212b" stroke-width="1.8"  marker-end="url(#open)"/><text x="735" y="330" font-size="18" text-anchor="start" fill="#18212b">identities</text><polyline points="1100,470 1220,470" fill="none" stroke="#18212b" stroke-width="1.8" stroke-dasharray="8 5" marker-end="url(#open)"/><polyline points="850,640 850,800" fill="none" stroke="#18212b" stroke-width="1.8"  marker-end="url(#open)"/><text x="662" y="725" font-size="18" text-anchor="start" fill="#18212b">requestContext</text><polyline points="1100,575 1160,575 1160,850 1220,850" fill="none" stroke="#18212b" stroke-width="1.8" stroke-dasharray="8 5" marker-end="url(#open)"/><rect x="600" y="390" width="500" height="250" fill="white" stroke="#18212b" stroke-width="2"/><path d="M600,444H1100 M600,543H1100" stroke="#18212b"/>
  <text x="850" y="425" font-size="21" text-anchor="middle" fill="#18212b">StructuredAuthenticationService</text>
  <text x="616" y="474" font-size="20" text-anchor="start" fill="#18212b">- users: UserJpaRepository</text><text x="616" y="503" font-size="20" text-anchor="start" fill="#18212b">- identities: IdentityTokenStore</text><text x="616" y="532" font-size="20" text-anchor="start" fill="#18212b">- requestContext: RequestContext</text>
  <text x="616" y="574" font-size="19" text-anchor="start" fill="#18212b">+ require(header: String): CurrentIdentity</text><rect x="40" y="380" width="440" height="170" fill="white" stroke="#18212b" stroke-width="2"/><path d="M40,434H480 M40,475H480" stroke="#18212b"/>
  <text x="260" y="415" font-size="21" text-anchor="middle" fill="#18212b">«interface» UserJpaRepository</text>
  
  <text x="56" y="506" font-size="19" text-anchor="start" fill="#18212b">+ findById(id: Long): Optional&lt;UserEntity&gt;</text><text x="56" y="535" font-size="19" text-anchor="start" fill="#18212b">  （继承JpaRepository的方法）</text><rect x="600" y="105" width="500" height="170" fill="white" stroke="#18212b" stroke-width="2"/><path d="M600,159H1100 M600,200H1100" stroke="#18212b"/>
  <text x="850" y="140" font-size="21" text-anchor="middle" fill="#18212b">«interface» IdentityTokenStore</text>
  

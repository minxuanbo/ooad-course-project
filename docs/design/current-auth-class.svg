  <text x="1236" y="506" font-size="19" text-anchor="start" fill="#18212b">+ isEnabled(): boolean</text><text x="1236" y="535" font-size="19" text-anchor="start" fill="#18212b">+ getId(), getUsername(), getDepartment()</text><rect x="600" y="800" width="500" height="160" fill="white" stroke="#18212b" stroke-width="2"/><path d="M600,854H1100 M600,895H1100" stroke="#18212b"/>

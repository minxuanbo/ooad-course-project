  <rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><text x="28" y="38" font-size="26" text-anchor="start" fill="#223046">人员调动的双范围与归属 · DDD差异</text><text x="28" y="70" font-size="16" text-anchor="start" fill="#223046">仅成功差异片段；共同HTTP/身份/日志/锁后鉴权/K/提交均省略，不表示取消。赋值调用不重复画回复；异常约定见正文。</text><rect x="25" y="690" width="2670" height="150" fill="#f8fafc" stroke="#91a2b7"/><path d="M25,720h70v-30" fill="none" stroke="#91a2b7"/><text x="35" y="712" font-size="16" text-anchor="start" fill="#223046">loop</text><text x="616" y="712" font-size="16" text-anchor="start" fill="#223046">[过滤人员现有角色]</text><path d="M110,165V1270" stroke="#9aa7b7" stroke-dasharray="7 6"/><rect x="20" y="100" width="180" height="65" fill="white" stroke="#223046"/><text x="110" y="139" font-size="19" text-anchor="middle" fill="#223046">obj: 调用者</text><path d="M590,165V1270" stroke="#9aa7b7" stroke-dasharray="7 6"/><rect x="420" y="100" width="340" height="65" fill="white" stroke="#223046"/><text x="590" y="139" font-size="16.332819722650232" text-anchor="middle" fill="#223046">service: DddUserManagementService</text><path d="M1070,165V1270" stroke="#9aa7b7" stroke-dasharray="7 6"/><rect x="900" y="100" width="340" height="65" fill="white" stroke="#223046"/><text x="1070" y="139" font-size="19" text-anchor="middle" fill="#223046">scope: DddScope</text><path d="M1550,165V1270" stroke="#9aa7b7" stroke-dasharray="7 6"/><rect x="1380" y="100" width="340" height="65" fill="white" stroke="#223046"/><text x="1550" y="139" font-size="19" text-anchor="middle" fill="#223046">target: User</text><path d="M2030,165V1270" stroke="#9aa7b7" stroke-dasharray="7 6"/><rect x="1860" y="100" width="340" height="65" fill="white" stroke="#223046"/><text x="2030" y="139" font-size="19" text-anchor="middle" fill="#223046">role: Role</text><path d="M2510,165V1270" stroke="#9aa7b7" stroke-dasharray="7 6"/><rect x="2340" y="100" width="340" height="65" fill="white" stroke="#223046"/><text x="2510" y="126" font-size="17" text-anchor="middle" fill="#223046">«MetaClass»</text><text x="2510" y="151" font-size="20" text-anchor="middle" fill="#223046">: OrganizationPolicy</text><rect x="103" y="210" width="14" height="1040" fill="white" stroke="#223046"/><rect x="583" y="245" width="14" height="980" fill="white" stroke="#223046"/><rect x="1063" y="415" width="14" height="60" fill="white" stroke="#223046"/><rect x="2503" y="585" width="14" height="60" fill="white" stroke="#223046"/><rect x="2023" y="755" width="14" height="60" fill="white" stroke="#223046"/><rect x="1543" y="925" width="14" height="60" fill="white" stroke="#223046"/><rect x="1543" y="1095" width="14" height="60" fill="white" stroke="#223046"/><path d="M117,245H583" stroke="#223046" marker-end="url(#filled)"/><text x="129" y="231" font-size="18" text-anchor="start" fill="#223046">1 move 的差异片段</text><path d="M597,415H1063" stroke="#223046" marker-end="url(#filled)"/><text x="609" y="401" font-size="12.91642314436002" text-anchor="start" fill="#223046">2 filter(organization, actor.departmentId(), departmentId)</text><path d="M597,585H2503" stroke="#223046" marker-end="url(#filled)"/><text x="609" y="571" font-size="18" text-anchor="start" fill="#223046">3 ancestors = ancestors(organization, department.id)</text><path d="M597,755H2023" stroke="#223046" marker-end="url(#filled)"/><text x="609" y="741" font-size="18" text-anchor="start" fill="#223046">4 applicable(ancestors)</text><path d="M597,925H1543" stroke="#223046" marker-end="url(#filled)"/><text x="609" y="911" font-size="18" text-anchor="start" fill="#223046">5 changed = transfer(department)</text><path d="M597,1095H1543" stroke="#223046" marker-end="url(#filled)"/><text x="609" y="1081" font-size="18" text-anchor="start" fill="#223046">6 changed = replaceRoles(retained)</text></g></svg>
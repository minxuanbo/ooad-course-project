  <rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><text x="28" y="38" font-size="26" text-anchor="start" fill="#223046">可信共同根判断 · Structured差异</text><text x="28" y="70" font-size="16" text-anchor="start" fill="#223046">仅成功差异片段；共同HTTP/身份/日志/锁后鉴权/K/提交均省略，不表示取消。赋值调用不重复画回复；异常约定见正文。</text><path d="M110,165V1005" stroke="#9aa7b7" stroke-dasharray="7 6"/><rect x="20" y="100" width="180" height="65" fill="white" stroke="#223046"/><text x="110" y="139" font-size="19" text-anchor="middle" fill="#223046">obj: 调用者</text><path d="M590,165V1005" stroke="#9aa7b7" stroke-dasharray="7 6"/><rect x="420" y="100" width="340" height="65" fill="white" stroke="#223046"/><text x="590" y="139" font-size="13.145928069450187" text-anchor="middle" fill="#223046">service: StructuredDepartmentScopeService</text><path d="M1070,165V1005" stroke="#9aa7b7" stroke-dasharray="7 6"/><rect x="900" y="100" width="340" height="65" fill="white" stroke="#223046"/><text x="1070" y="139" font-size="15.852442671984049" text-anchor="middle" fill="#223046">sources: ImportSourceJpaRepository</text><path d="M1550,165V1005" stroke="#9aa7b7" stroke-dasharray="7 6"/><rect x="1380" y="100" width="340" height="65" fill="white" stroke="#223046"/><text x="1550" y="139" font-size="14.971751412429379" text-anchor="middle" fill="#223046">departments: DepartmentJpaRepository</text><rect x="103" y="210" width="14" height="775" fill="white" stroke="#223046"/><rect x="583" y="245" width="14" height="715" fill="white" stroke="#223046"/><rect x="1063" y="415" width="14" height="60" fill="white" stroke="#223046"/><rect x="1543" y="585" width="14" height="60" fill="white" stroke="#223046"/><rect x="1543" y="755" width="14" height="60" fill="white" stroke="#223046"/><rect x="620" y="845" width="660" height="55" fill="#fffbea" stroke="#b6a56d"/><text x="632" y="870" font-size="16" text-anchor="start" fill="#223046">Service比较来源根、父级、直属部门及子树人数。</text><path d="M117,245H583
  <rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><text x="28" y="38" font-size="26" text-anchor="start" fill="#223046">完整维护者判定 · Structured差异</text><text x="28" y="70" font-size="16" text-anchor="start" fill="#223046">仅成功差异片段；共同HTTP/身份/日志/锁后鉴权/K/提交均省略，不表示取消。赋值调用不重复画回复；异常约定见正文。</text><rect x="25" y="520" width="2190" height="340" fill="#f8fafc" stroke="#91a2b7"/><path d="M25,550h70v-30" fill="none" stroke="#91a2b7"/><text x="35" y="542" font-size="16" text-anchor="start" fill="#223046">loop</text><text x="616" y="542" font-size="16" text-anchor="start" fill="#223046">逐个根直属启用人员，发现合格者即停止</text><rect x="45" y="685" width="2150" height="150" fill="none" stroke="#91a2b7"/><path d="M45,713h60v-28" fill="none" stroke="#91a2b7"/><text x="55" y="705" font-size="15" text-anchor="start" fill="#223046">opt</text><text x="616" y="705" font-size="16" text-anchor="start" fill="#223046">该人员有效基础级别为5</text><path d="M110,165V1005" stroke="#9aa7b7" stroke-dasharray="7 6"/><rect x="20" y="100" width="180" height="65" fill="white" stroke="#223046"/><text x="110" y="139" font-size="19" text-anchor="middle" fill="#223046">obj: 调用者</text><path d="M590,165V1005" stroke="#9aa7b7" stroke-dasharray="7 6"/><rect x="420" y="100" width="340" height="65" fill="white" stroke="#223046"/><text x="590" y="139" font-size="15.39951573849879" text-anchor="middle" fill="#223046">service: StructuredMaintenanceGuard</text><path d="M1070,165V1005" stroke="#9aa7b7" stroke-dasharray="7 6"/><rect x="900" y="100" width="340" height="65" fill="white" stroke="#223046"/><text x="1070" y="139" font-size="19" text-anchor="middle" fill="#223046">users: UserJpaRepository</text><path d="M1550,165V1005" stroke="#9aa7b7" stroke-dasharray="7 6"/><rect x="1380" y="100" width="340" height="65" fill="white" stroke="#223046"/><text x="1550" y="139" font-size="13.82007822685789" text-anchor="middle" fill="#223046">authority: StructuredPersonnelAuthority</text><path d="M2030,165V1005" stroke="#9aa7b7" stroke-dasharray="7 6"/><rect x="1860" y="100" width="340" height="65" fill="white" stroke="#223046"/><text x="2030" y="139" font-size="10.999654098927708" text-anchor="middle" fill="#223046">permissions: StructuredEffectivePermissionService</text><rect x="103" y="210" width="14" height="775" fill="white" stroke="#223046"/><rect x="583" y="245" width="14" height="715" fill="white" stroke="#223046"/><rect x="1063" y="415" width="14" height="60" fill="white" stroke="#223046"/><rect x="1543" y="585" width="14" height="60" fill="white" stroke="#223046"/><rect x="2023" y="755" width="14" height="60" fill="white" stroke="#223046"/><rect x="620" y="845" width="660" height="55" fill="#fffbea" stroke="#b6a56d"/><text x="632" y="870" font-size="16" text-anchor="start" fill="#223046">同一人须为有效五级且覆盖全部K；不拼多人权限。</text><path d="M117,245H583" stroke="#223046" marker-end="url(#filled)"/><text x="129" y="231" font-size="18" text-anchor="start" fill="#223046">1 完整维护者判定差异片段</text><path d="M597,415H1063" stroke="#223046" marker-end="url(#filled)"/><text x="609" y="401" font-size="14.689265536723166" text-anchor="start" fill="#223046">2 people = findByDepartmentIdAndEnabledTrue(rootId)</text><path d="M597,585H1543" stroke="#223046" marker-end="url(#filled)"/><text x="609" y="571" font-size="18" text-anchor="start" fill="#223046">3 level = level(user)</text><path d="M597,755H2023" stroke="#223046" marker-end="url(#filled)"/><text x="609" y="741" font-size="18" text-anchor="start" fill="#223046">4 effective = routes(user.id)</text></g></svg>
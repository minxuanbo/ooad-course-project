  <rect width="100%" height="100%" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="30" y="43" font-size="28" text-anchor="start" fill="#18212b">当前身份校验 · 顺序图</text><text x="30" y="77" font-size="18" text-anchor="start" fill="#18212b">StructuredAuthenticationService.require · caller为调用该方法的Controller/门禁；省略简单get访问器及返回对象构造，异常未捕获不逐层转发。</text><rect x="25" y="260" width="2195" height="950" fill="none" stroke="#8793a0"/><rect x="25" y="260" width="65" height="30" fill="#f0f3f7" stroke="#8793a0"/><text x="35" y="282" font-size="18" text-anchor="start" fill="#18212b">alt</text><text x="107" y="282" font-size="18" text-anchor="start" fill="#18212b">[凭据缺失或失效]</text><path d="M25,410H2220" stroke="#8793a0" stroke-dasharray="7 4"/><text x="110" y="441" font-size="18" text-anchor="start" fill="#18212b">[凭据有效]</text><rect x="1000" y="640" width="1200" height="125" fill="none" stroke="#8793a0"/><rect x="1000" y="640" width="65" height="30" fill="#f0f3f7" stroke="#8793a0"/><text x="1010" y="662" font-size="18" text-anchor="start" fill="#18212b">opt</text><text x="1082" y="662" font-size="18" text-anchor="start" fill="#18212b">[找到用户；Optional.filter调用UserEntity::isEnabled]</text><rect x="25" y="800" width="2195" height="385" fill="none" stroke="#8793a0"/><rect x="25" y="800" width="65" height="30" fill="#f0f3f7" stroke="#8793a0"/><text x="35" y="822" font-size="18" text-anchor="start" fill="#18212b">alt</text><text x="107" y="822" font-size="18" text-anchor="start" fill="#18212b">[用户不存在或已停用]</text><path d="M25,960H2220" stroke="#8793a0" stroke-dasharray="7 4"/><text x="110" y="990" font-size="18" text-anchor="start" fill="#18212b">[用户存在且启用]</text><path d="M90,158V1230" stroke="#9ba6b1" stroke-dasharray="7 6"/><rect x="15" y="100" width="150" height="58" fill="white" stroke="#18212b"/><text x="90" y="136" font-size="19" text-anchor="middle" fill="#18212b">obj: 调用者</text><path d="M410,158V1230" stroke="#9ba6b1" stroke-dasharray="7 6"/><rect x="265" y="100" width="290" height="58" fill="white" stroke="#18212b"/><text x="410" y="136" font-size="15" text-anchor="middle" fill="#18212b">auth: StructuredAuthenticationService</text><path d="M750,158V1230" stroke="#9ba6b1" stroke-dasharray="7 6"/><rect x="605" y="100" width="290" height="58" fill="white" stroke="#18212b"/><text x="750" y="136" font-size="17" text-anchor="middle" fill="#18212b">identities: IdentityTokenStore</text><path d="M1080,158V1230" stroke="#9ba6b1" stroke-dasharray="7 6"/><rect x="935" y="100" width="290" height="58" fill="white" stroke="#18212b"/><text x="1080" y="136" font-size="19" text-anchor="middle" fill="#18212b">users: UserJpaRepository</text><path d="M1400,158V1230" stroke="#9ba6b1" stroke-dasharray="7 6"/><rect x="1255" y="100" width="290" height="58" fill="white" stroke="#18212b"/><text x="1400" y="136" font-size="19" text-anchor="middle" fill="#18212b">user: UserEntity</text><path d="M1720,158V1230" stroke="#9ba6b1" stroke-dasharray="7 6"/><rect x="1575" y="100" width="290" height="58" fill="white" stroke="#18212b"/><text x="1720" y="123" font-size="17" text-anchor="middle" fill="#18212b">«MetaClass»</text><text x="1720" y="148" font-size="19" text-anchor="middle" fill="#18212b">: BusinessException</text><path d="M2050,158V1230" stroke="#9ba6b1" stroke-dasharray="7 6"/><rect x="1905" y="100" width="290" height="58" fill="white" stroke="#18212b"/><text x="2050" y="136" font-size="17" text-anchor="middle" fill="#18212b">requestContext: RequestContext</text><rect x="83" y="190" width="14" height="990" fill="white" stroke="#18212b"/><rect x="403" y="210" width="14" height="960" fill="white" stroke="#18212b"/><rect x="743" y="300" width="14" height="55" fill="white" stroke="#18212b"/><rect x="743" y="475" width="14" height="40" fill="white" stroke="#18212b"/><rect x="1073" y="560" width="14" height="40" fill="white" stroke="#18212b"/><rect x="1393" y="690" width="14" height="40" fill="white" stroke="#18212b"/><rect x="1713" y="855" width="14" height="40" fill="white" stroke="#18212b"/><rect x="2043" y="1060" width="14" height="40" fill="white" stroke="#18212b"/><path d="M97,210H403" fill="none" stroke="#18212b" stroke-width="1.7"  marker-end="url(#filled)"/><text x="111" y="198" font-size="18" text-anchor="start" fill="#18212b">1 require(header)</text><path d="M417,300H743" fill="none" stroke="#18212b" stroke-width="1.7"  marker-end="url(#filled)"/><text x="431" y="288" font-size="18" text-anchor="start" fill="#18212b">2 require(header)</text><path d="M743,340H97" fill="none" stroke="#18212b" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#open)"/><text x="111" y="328" font-size="18" text-anchor="start" fill="#18212b">AUTHENTICATION_REQUIRED / SESSION_INVALID</text><path d="M417,475H743" fill="none" stroke="#18212b" stroke-width="1.7"  marker-end="url(#filled)"/><text x="431" y="463" font-size="18" text-anchor="start" fill="#18212b">3 userId = require(header)</text><path d="M417,560H1073" fill="none" stroke="#18212b" stroke-width="1.7"  marker-end="url(#filled)"/><text x="431" y="548" font-size="18" text-anchor="start" fill="#18212b">4 candidate = findById(userId)</text><path d="M417,690H1393" fill="none" stroke="#18212b" stroke-width="1.7"  marker-end="url(#filled)"/><text x="431" y="678" font-size="18" text-anchor="start" fill="#18212b">5 enabled = isEnabled()</text><path d="M417,855H1713" fill="none" stroke="#18212b" stroke-width="1.7"  marker-end="url(#filled)"/><text x="431" y="843" font-size="18" text-anchor="start" fill="#18212b">6 exception = unauthorized()</text><path d="M403,915H97" fill="none" stroke="#18212b" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#open)"/><text x="111" y="903" font-size="18" text-anchor="start" fill="#18212b">SESSION_INVALID（orElseThrow抛出）</text><path d="M417,1060H2043" fill="none" stroke="#18212b" stroke-width="1.7"  marker-end="url(#filled)"/><text x="431" y="1048" font-size="18" text-anchor="start" fill="#18212b">7 actor(userId, username)</text><path d="M403,1140H97" fill="none" stroke="#18212b" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#open)"/><text x="111" y="1128" font-size="18" text-anchor="start" fill="#18212b">CurrentIdentity</text></g></svg>
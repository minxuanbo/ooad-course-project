  <rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><text x="28" y="38" font-size="26" text-anchor="start" fill="#223046">范围内人员分页 · Structured现状差异</text><text x="28" y="70" font-size="16" text-anchor="start" fill="#223046">仅成功差异片段；共同HTTP/身份/日志/锁后鉴权/K/提交均省略，不表示取消。赋值调用不重复画回复；异常约定见正文。</text><path d="M110,165V710" stroke="#9aa7b7" stroke-dasharray="7 6"/><rect x="20" y="100" width="180" height="65" fill="white" stroke="#223046"/><text x="110" y="139" font-size="19" text-anchor="middle" fill="#223046">obj: 调用者</text><path d="M490,165V710" stroke="#9aa7b7" stroke-dasharray="7 6"/><rect x="320" y="100" width="340" height="65" fill="white" stroke="#223046"/><text x="490" y="139" font-size="15.39951573849879" text-anchor="middle" fill="#223046">service: StructuredUserQueryService</text><path d="M870,165V710" stroke="#9aa7b7" stroke-dasharray="7 6"/><rect x="700" y="100" width="340" height="65" fill="white" stroke="#223046"/><text x="870" y="139" font-size="19" text-anchor="middle" fill="#223046">users: UserJpaRepository</text><rect x="103" y="210" width="14" height="480" fill="white" stroke="#223046"/><rect x="483" y="245" width="14" height="420" fill="white" stroke="#223046"/><rect x="863" y="415" width="14" height="60" fill="white" stroke="#223046"/><rect x="863" y="585" width="14" height="60" fill="white" stroke="#223046"/><path d="M117,245H483" stroke="#223046" marker-end="url(#filled)"/><text x="129" y="231" font-size="18" text-anchor="start" fill="#223046">1 pageResult = list 的差异片段</text><path d="M497,415H863" stroke="#223046" marker-end="url(#filled)"/><text x="509" y="401" font-size="18" text-anchor="start" fill="#223046">2 total = count(filter)</text><path d="M497,585H863" stroke="#223046" marker-end="url(#filled)"/><text x="509" y="571" font-size="14.138073584125673" text-anchor="start" fill="#223046">3 entities = findAll(filter, pageRequest)</text></g></svg>
spring:
  application.name: municipal-rbac-core
  datasource:
    url: ${RBAC_CORE_DB_URL:}
    username: ${RBAC_CORE_DB_USER:}
    password: ${RBAC_CORE_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      transaction-isolation: TRANSACTION_READ_COMMITTED
  sql.init.mode: never
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  web.resources.add-mappings: false
  jackson.deserialization.fail-on-unknown-properties: true
server.port: ${PORT:8081}
rbac:
  initialize: false
  core:
    source-dir: ${RBAC_CORE_SOURCE_DIR:.}
logging.level:
  root: INFO
  com.municipal.rbaccore.api: DEBUG
  com.municipal.rbaccore.service: DEBUG
  com.municipal.rbaccore.logging: DEBUG
  com.municipal.rbaccore.bootstrap: DEBUG
  org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF

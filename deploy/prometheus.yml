global:
  scrape_interval: 1s
  scrape_timeout: 1s
  evaluation_interval: 2s
rule_files:
  - /etc/prometheus/rules/recording.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: rbac-ddd
    metrics_path: /actuator/prometheus
    scrape_interval: 2s
    static_configs:
      - targets: ['rbac-backend:8082']
  - job_name: course-ddd
    metrics_path: /actuator/prometheus
    scrape_interval: 2s
    static_configs:
      - targets: ['course-backend:8081']
  - job_name: node
    dns_sd_configs:
      - names: ['tasks.node-exporter']
        type: A
        port: 9100
        refresh_interval: 10s

version: "3.8"

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mysql:
    image: ${MYSQL_IMAGE}
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_bin", "--innodb-buffer-pool-size=256M", "--max-connections=60", "--performance-schema=OFF", "--mysqlx=OFF"]
    secrets: [mysql_root_password, rbac_db_password, course_db_password, audit_db_password, course_read_password]
    configs:
      - source: mysql_init
        target: /docker-entrypoint-initdb.d/00-ooad.sh
        mode: 0444
      - source: core_schema
        target: /bootstrap/rbac-core-schema.sql
      - source: core_runtime
        target: /bootstrap/rbac-core-runtime.sql
      - source: audit_schema
        target: /bootstrap/course-audit-schema.sql
    volumes: [mysql_data:/var/lib/mysql]
    networks: [javaee-proxy]
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 120s
    deploy:
      replicas: 1
      placement:
        constraints: [node.hostname == course-worker-mysql]
      resources:
        limits: {memory: 1024M}
        reservations: {memory: 384M}
      restart_policy: {delay: 15s}
      update_config: {order: stop-first, failure_action: rollback}
      rollback_config: {order: stop-first}

  rbac-backend:
    image: ${RBAC_BACKEND_IMAGE}
    environment:
      APP_BACKEND_STRATEGY: ddd
      RBAC_CORE_DB_URL: jdbc:mysql://mysql:3306/rbac_core?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
      RBAC_CORE_DB_USER: rbac
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      APP_IDENTITY_ENABLED: "true"
      IDENTITY_ALLOWED_ORIGINS: ${COURSE_PUBLIC_ORIGIN}
      IDENTITY_JWT_ISSUER: ${RBAC_PUBLIC_ORIGIN}
      AUDIT_TRUSTED_PROXIES: ${RBAC_AUDIT_TRUSTED_PROXIES:-}
      MANAGEMENT_SERVER_PORT: "8082"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
      SERVER_TOMCAT_THREADS_MAX: "40"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=32m -Xss512k -XX:+ExitOnOutOfMemoryError
      LOGGING_LEVEL_COM_MUNICIPAL_RBACCORE_API: DEBUG
      LOGGING_LEVEL_COM_MUNICIPAL_RBACCORE_SERVICE: DEBUG
      LOGGING_LEVEL_COM_MUNICIPAL_RBACCORE_INFRASTRUCTURE: DEBUG
      LOGGING_PATTERN_DATEFORMAT: "yyyy-MM-dd'T'HH:mm:ss.SSSXXX,Asia/Shanghai"
    secrets:
      - source: rbac_db_password
        target: spring.datasource.password
      - source: jwt_secret
        target: app.identity.jwt-secret
    networks: [javaee-proxy]
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s
    deploy:
      replicas: ${APP_REPLICAS:-0}
      placement:
        constraints: [node.hostname == course-worker-log]
      resources:
        limits: {memory: 640M}
        reservations: {memory: 256M}
      restart_policy: {delay: 15s}
      update_config: {order: stop-first, failure_action: rollback}
      rollback_config: {order: stop-first}

  course-backend:
    image: ${COURSE_BACKEND_IMAGE}
    environment:
      APP_BACKEND_STRATEGY: ddd
      SPRING_PROFILES_ACTIVE: swarm
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: course_project
      DB_USER: course_app
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      APP_IDENTITY_BASE_URL: http://course-integration:8085
      CORS_ALLOWED_ORIGINS: ${COURSE_PUBLIC_ORIGIN}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
      SERVER_TOMCAT_THREADS_MAX: "40"
      JAVA_TOOL_OPTIONS: -Xms96m -Xmx448m -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=48m -Xss512k -XX:+ExitOnOutOfMemoryError
      LOGGING_LEVEL_CN_EDU_XMU_PROJECTMGT_API: DEBUG
      LOGGING_LEVEL_CN_EDU_XMU_PROJECTMGT_SERVICE: DEBUG
      LOGGING_LEVEL_CN_EDU_XMU_PROJECTMGT_INFRASTRUCTURE: DEBUG
      LOGGING_PATTERN_DATEFORMAT: "yyyy-MM-dd'T'HH:mm:ss.SSSXXX,Asia/Shanghai"
    secrets:
      - source: course_db_password
        target: spring.datasource.password
    networks: [javaee-proxy]
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s
    deploy:
      replicas: ${APP_REPLICAS:-0}
      placement:
        constraints: [node.hostname == course-worker-app]
      resources:
        limits: {memory: 896M}
        reservations: {memory: 384M}
      restart_policy: {delay: 15s}
      update_config: {order: stop-first, failure_action: rollback}
      rollback_config: {order: stop-first}

  course-integration:
    image: ${INTEGRATION_IMAGE}
    environment:
      RBAC_BASE_URL: http://rbac-backend:8081
      RBAC_HEALTH_BASE_URL: http://rbac-backend:8082
      AUDIT_TRUSTED_PROXIES: ${INTEGRATION_AUDIT_TRUSTED_PROXIES:-}
      DB_HOST: mysql
      ALLOWED_ORIGINS: ${COURSE_PUBLIC_ORIGIN}
    secrets: [audit_db_password, course_read_password]
    networks: [javaee-proxy]
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/healthz',timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    deploy:
      replicas: ${APP_REPLICAS:-0}
      placement:
        constraints: [node.hostname == course-worker-log]
      resources:
        limits: {memory: 128M}
        reservations: {memory: 32M}
      restart_policy: {delay: 15s}
      update_config: {order: stop-first, failure_action: rollback}
      rollback_config: {order: stop-first}

  rbac-frontend:
    image: ${RBAC_FRONTEND_IMAGE}
    configs:
      - source: nginx_rbac
        target: /etc/nginx/conf.d/default.conf
    ports:
      - {target: 80, published: 8088, protocol: tcp, mode: host}
    networks: [javaee-proxy]
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: ${APP_REPLICAS:-0}
      placement:
        constraints: [node.hostname == course-manager]
      resources:
        limits: {memory: 64M}
        reservations: {memory: 16M}
      update_config: {order: stop-first, failure_action: rollback}
      rollback_config: {order: stop-first}

  course-frontend:
    image: ${COURSE_FRONTEND_IMAGE}
    configs:
      - source: nginx_course
        target: /etc/nginx/conf.d/default.conf
    ports:
      - {target: 80, published: 80, protocol: tcp, mode: host}
    networks: [javaee-proxy]
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: ${APP_REPLICAS:-0}
      placement:
        constraints: [node.hostname == course-manager]
      resources:
        limits: {memory: 64M}
        reservations: {memory: 16M}
      update_config: {order: stop-first, failure_action: rollback}
      rollback_config: {order: stop-first}

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=2GB"]
    configs:
      - source: prometheus
        target: /etc/prometheus/prometheus.yml
      - source: prometheus_rules
        target: /etc/prometheus/rules/recording.yml
    volumes: [prometheus_data:/prometheus]
    networks: [javaee-proxy]
    logging: *logging
    deploy:
      replicas: 1
      placement:
        constraints: [node.hostname == course-manager]
      resources:
        limits: {memory: 320M}
        reservations: {memory: 128M}
      update_config: {order: stop-first, failure_action: rollback}
      rollback_config: {order: stop-first}

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE}
    hostname: "{{.Node.Hostname}}"
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.filesystem
      - --collector.diskstats
      - --collector.uname
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($$|/)
    read_only: true
    volumes:
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true
      - type: bind
        source: /
        target: /rootfs
        read_only: true
        bind:
          propagation: rslave
    networks: [javaee-proxy]
    logging: *logging
    deploy:
      mode: global
      resources:
        limits: {memory: 96M}
        reservations: {memory: 24M}
      update_config: {order: stop-first, failure_action: rollback}
      rollback_config: {order: stop-first}

networks:
  javaee-proxy:
    external: true

volumes:
  mysql_data:
    name: ooad_mysql_v1
  prometheus_data:
    name: ooad_prometheus_v1

configs:
  mysql_init:
    name: ooad_mysql_init_${RELEASE_ID}
    file: ./mysql-init.sh
  core_schema:
    name: ooad_core_schema_${RELEASE_ID}
    file: ./rbac-core-schema.sql
  core_runtime:
    name: ooad_core_runtime_${RELEASE_ID}
    file: ./rbac-core-runtime.sql
  audit_schema:
    name: ooad_audit_schema_${RELEASE_ID}
    file: ./course-audit-schema.sql
  nginx_rbac:
    name: ooad_nginx_rbac_${RELEASE_ID}
    file: ./nginx-rbac.conf
  nginx_course:
    name: ooad_nginx_course_${RELEASE_ID}
    file: ./nginx-course.conf
  prometheus:
    name: ooad_prometheus_${RELEASE_ID}
    file: ./prometheus.yml
  prometheus_rules:
    name: ooad_prometheus_rules_${RELEASE_ID}
    file: ./prometheus-rules.yml

secrets:
  mysql_root_password:
    external: true
    name: ${SECRET_PREFIX}_mysql_root_password
  rbac_db_password:
    external: true
    name: ${SECRET_PREFIX}_rbac_db_password
  course_db_password:
    external: true
    name: ${SECRET_PREFIX}_course_db_password
  audit_db_password:
    external: true
    name: ${SECRET_PREFIX}_audit_db_password
  course_read_password:
    external: true
    name: ${SECRET_PREFIX}_course_read_password
  jwt_secret:
    external: true
    name: ${SECRET_PREFIX}_jwt_secret
